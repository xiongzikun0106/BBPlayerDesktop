<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:"
		/>
		<title>歌词面板测试台 · BBPlayer Desktop</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="stylesheet" href="lyrics-panel.css" />
		<style>
			body {
				overflow: auto;
			}

			.lab {
				padding: 20px;
				display: flex;
				flex-direction: column;
				gap: 14px;
			}

			.lab__title {
				margin: 0;
				font-size: 18px;
			}

			.lab__row {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				align-items: center;
			}

			.lab__row button {
				background: var(--surface-3);
				color: var(--on-surface);
				border: none;
				border-radius: var(--r-full);
				padding: 8px 14px;
				cursor: pointer;
				font: inherit;
			}

			.lab__row button:hover {
				filter: brightness(1.15);
			}

			.lab__status {
				font-size: 12px;
				color: var(--on-surface-variant);
				min-height: 18px;
			}

			.lab__error {
				color: var(--bad);
			}

			.lab__main {
				display: flex;
				gap: 20px;
				flex-wrap: wrap;
				align-items: flex-start;
			}

			.lab__side {
				flex: 1 1 320px;
				min-width: 320px;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.lab__side h2 {
				margin: 0;
				font-size: 14px;
			}

			#search-input {
				flex: 1;
				background: var(--surface-2);
				border: 1px solid var(--outline);
				border-radius: var(--r-full);
				color: var(--on-surface);
				padding: 9px 16px;
				font: inherit;
				min-width: 220px;
			}

			.lab__candidates {
				list-style: none;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: 6px;
				max-height: 260px;
				overflow: auto;
			}

			.lab__candidate {
				padding: 8px 10px;
				border-radius: 8px;
				background: var(--surface-2);
				cursor: pointer;
				font-size: 12px;
				display: flex;
				justify-content: space-between;
				gap: 8px;
			}

			.lab__candidate:hover {
				filter: brightness(1.15);
			}

			.lab__candidate.is-best {
				outline: 1px solid var(--primary);
			}

			.lab__score {
				color: var(--primary);
				font-variant-numeric: tabular-nums;
			}

			#scrub {
				width: 100%;
			}
		</style>
	</head>
	<body>
		<div class="lab">
			<h1 class="lab__title">歌词面板测试台</h1>

			<div class="lab__row">
				<button id="btn-demo" data-testid="btn-demo">载入内置示例歌词</button>
				<button id="btn-ipc" data-testid="btn-ipc">从主进程拉真实歌词</button>
				<button id="btn-offline" data-testid="btn-offline">离线合成示例歌词</button>
				<span class="lab__status" id="lab-status" data-testid="lab-status"
					>就绪：请点「载入内置示例歌词」</span
				>
			</div>

			<div class="lab__main">
				<!-- ── 左：歌词面板本体 ─────────────────────────── -->
				<div class="lyrics-lab__stage" data-testid="lab-stage">
					<div id="lyrics-panel" data-testid="lyrics-panel"></div>
				</div>

				<!-- ── 右：驱动面板的控件 ───────────────────────── -->
				<div class="lab__side">
					<h2>模拟播放位置（秒）</h2>
					<div class="lab__row">
						<input
							id="scrub"
							data-testid="scrub"
							type="range"
							min="0"
							max="260"
							step="0.1"
							value="0"
						/>
						<span class="mono" id="scrub-value" data-testid="scrub-value">0.0</span>
					</div>

					<div class="lab__row">
						<button id="btn-tick" data-testid="btn-tick">+5s</button>
						<button id="btn-first" data-testid="btn-first">回到开头</button>
						<button id="btn-mid" data-testid="btn-mid">跳到 60s</button>
					</div>

					<h2>真实网络取词（经主进程 core 端口）</h2>
					<div class="lab__row">
						<input
							id="search-input"
							data-testid="search-input"
							type="text"
							value="Never Gonna Give You Up"
							placeholder="歌名 或 歌名 歌手"
							spellcheck="false"
						/>
						<button id="btn-search" data-testid="btn-search">搜索</button>
					</div>
					<ul
						class="lab__candidates"
						id="candidates"
						data-testid="candidates"
					></ul>
				</div>
			</div>
		</div>

		<script src="lyrics-panel.js"></script>
		<script src="lyrics-lab.js"></script>
	</body>
</html>
